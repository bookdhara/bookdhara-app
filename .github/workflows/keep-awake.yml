name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 idle minutes, and waking it takes about a
# minute. A light ping every 10 minutes keeps it awake (one free service fits in Render's monthly
# free hours). Note: GitHub pauses scheduled workflows after 60 days without repo activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/status
        run: curl -fsS --max-time 120 https://bookdhara-app.onrender.com/api/status || echo "Ping failed (server may be restarting)"
