name: Live API smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Backend URL"
        default: "https://bookdhara-app.onrender.com"
        required: true
      email:
        description: "unused here"
        default: "x"
        required: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Browser check from the app's origin
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', m => console.log('CONSOLE', m.type(), m.text()));
          page.on('requestfailed', r => console.log('REQFAILED', r.method(), r.url(), r.failure()?.errorText));
          page.on('response', r => { if (r.url().includes('onrender')) console.log('RESPONSE', r.status(), r.request().method(), r.url()); });
          await page.goto('https://bookdhara.github.io/bookdhara-app/', { waitUntil: 'load', timeout: 60000 });
          await page.waitForTimeout(5000);
          const results = await page.evaluate(async () => {
            const out = [];
            const base = 'https://bookdhara-app.onrender.com';
            for (const [name, opts] of [
              ['GET status', { method: 'GET', headers: { 'Accept': 'application/json' } }],
              ['POST otp invalid email', { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ email: 'x' }) }],
            ]) {
              try {
                const r = await fetch(base + (name.startsWith('GET') ? '/api/status' : '/api/auth/otp/request'), opts);
                out.push(name + ' -> ' + r.status + ' ' + (await r.text()).slice(0, 150));
              } catch (e) { out.push(name + ' -> ERROR ' + e); }
            }
            return out;
          });
          console.log(results.join('\n'));
          await browser.close();
          JS
          node check.mjs
