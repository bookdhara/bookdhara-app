name: Debug login page (temporary)
on:
  push:
    branches: [debug/google-button]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: Open the login page like a phone
        run: |
          cat > look.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(viewport={"width": 390, "height": 844}, device_scale_factor=2)
                  page = await ctx.new_page()
                  page.on("console", lambda m: print("CONSOLE", m.type, m.text))
                  page.on("pageerror", lambda e: print("PAGEERROR", e))
                  page.on("requestfailed", lambda r: print("REQFAILED", r.url, r.failure))
                  page.on("response", lambda r: print("RESP", r.status, r.url) if ("providers" in r.url or "gsi" in r.url or "main.dart" in r.url) else None)
                  await page.goto("https://bookdhara.github.io/bookdhara-app/", wait_until="networkidle")
                  await page.wait_for_timeout(25000)
                  await page.screenshot(path="login.png")
                  info = await page.evaluate("""() => ({
                    gsiLoaded: !!(window.google && google.accounts && google.accounts.id),
                    helper: typeof window.bookdharaGoogle,
                    iframes: [...document.querySelectorAll('iframe')].map(f => f.src.slice(0, 80)),
                    platformViews: document.querySelectorAll('flt-platform-view').length,
                    shadowDivs: (() => { let n = 0; document.querySelectorAll('*').forEach(e => { if (e.shadowRoot) n += e.shadowRoot.querySelectorAll('iframe').length; }); return n; })(),
                    sw: navigator.serviceWorker ? 'yes' : 'no'
                  })""")
                  print("INFO", info)
                  await b.close()
          asyncio.run(main())
          PY
          python look.py
      - uses: actions/upload-artifact@v4
        with:
          name: login-screenshot
          path: login.png
