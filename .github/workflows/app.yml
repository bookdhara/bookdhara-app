name: App (Flutter web)

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds any missing standard project files (we keep only our own in git).
      # Our files are never overwritten; the sample test it adds is removed.
      - name: Fill in standard project files
        run: |
          flutter create --platforms=web --project-name bookdhara --org com.bookdhara .
          rm -f test/widget_test.dart

      - run: flutter pub get
      # Infos stay visible but don't fail the build: recent Flutter marks
      # package:flutter/material.dart as deprecated in favour of package:material_ui (migrate later).
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build web app
        run: flutter build web --release --base-href /bookdhara-app/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: app/build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
