spring:
  application:
    name: bookdhara-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookdhara}
    username: ${DB_USERNAME:bookdhara}
    password: ${DB_PASSWORD:bookdhara}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

bookdhara:
  jwt:
    # Must be at least 32 characters. Always set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    ttl: ${JWT_TTL:P30D}
  otp:
    length: 6
    ttl: PT5M
    max-attempts: 5
    max-requests-per-window: 3
    request-window: PT10M
    # Test mode only: shows the code in the app while no email service is connected.
    # Ignored (never shown) once Brevo is configured.
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}
  email:
    # Set BREVO_API_KEY (and BREVO_SENDER_EMAIL) on Render to send real emails. Empty = test mode.
    brevo-api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:bookdhara.in@gmail.com}
    sender-name: BookDhara
  google:
    # OAuth "Web application" client id from Google Cloud. Empty = Google sign-in hidden.
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bookdhara.github.io,http://localhost:3000,http://localhost:8081}
