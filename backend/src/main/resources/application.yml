spring:
  application:
    name: bookdhara-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookdhara}
    username: ${DB_USERNAME:bookdhara}
    password: ${DB_PASSWORD:bookdhara}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

bookdhara:
  jwt:
    # Must be at least 32 characters. Always set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
    ttl: ${JWT_TTL:P30D}
  otp:
    length: 6
    ttl: PT5M
    max-attempts: 5
    max-requests-per-window: 3
    request-window: PT10M
    # Shows the OTP in the API response so we can test without an SMS provider.
    # Must be false once a real SMS provider is connected.
    expose-in-response: ${OTP_EXPOSE_IN_RESPONSE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
