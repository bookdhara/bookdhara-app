<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The build sets this to the site's path, e.g. /bookdhara-app/ on GitHub Pages. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BookDhara: buy and sell used books near you. Kitaabein behti rahein.">
  <meta name="theme-color" content="#0B6B5D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BookDhara">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>BookDhara</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F5F6F2; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; font-size: 28px; font-weight: 700; color: #0B6B5D; }
  </style>
</head>
<body>
  <div id="loading">BookDhara</div>
  <!-- Google's sign-in library, used only by the "Continue with Google" button. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Called from Dart (lib/auth/google_button_web.dart).
    window.bookdharaGoogle = {
      render: function (el, clientId, onCredential, theme) {
        el.style.width = '100%';
        el.style.height = '100%';
        el.style.display = 'flex';
        el.style.justifyContent = 'center';
        el.style.alignItems = 'center';
        var tries = 0;
        function draw() {
          var ready = window.google && google.accounts && google.accounts.id;
          // Wait for the library to load and for Flutter to put the box on the page.
          if (!ready || !el.isConnected || el.offsetWidth === 0) {
            if (++tries < 300) setTimeout(draw, 100);
            return;
          }
          google.accounts.id.initialize({
            client_id: clientId,
            callback: function (response) { onCredential(response.credential); },
            ux_mode: 'popup',
            auto_select: false,
            cancel_on_tap_outside: true
          });
          el.innerHTML = '';
          google.accounts.id.renderButton(el, {
            type: 'standard', theme: theme, size: 'large', text: 'continue_with',
            shape: 'pill', logo_alignment: 'center',
            width: Math.min(Math.max(el.offsetWidth, 200), 400)
          });
        }
        draw();
      }
    };
  </script>
  <script>
    // Clean up the service worker older versions installed, plus its saved copy of the app,
    // so everyone gets the latest version on the next visit.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { if (k.indexOf('flutter') === 0) caches.delete(k); });
      }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
